<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عيادة الأسنان - Clinic Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <h2 data-ar="عيادة الأسنان" data-en="Dental Clinic">عيادة الأسنان</h2>
        
        <a href="#" class="active" data-ar="لوحة التحكم" data-en="Dashboard">لوحة التحكم</a>
        <a href="#" data-ar="إدارة المرضى" data-en="Patient Management">إدارة المرضى</a>
        <a href="#" data-ar="الجدول الأسبوعي" data-en="Weekly Schedule">الجدول الأسبوعي</a>
        <a href="#" data-ar="جدول كانبان" data-en="Kanban Schedule">جدول كانبان</a>
        <a href="#" data-ar="المدفوعات" data-en="Payments Chart">المدفوعات</a>
        <a href="#" data-ar="الإعدادات" data-en="Settings">الإعدادات</a>

        <div class="controls">
            <button id="themeToggle">🌙 Dark Mode</button>
            <button id="langToggle">English / عربي</button>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="content-area">
        <h1 data-ar="إدارة المرضى" data-en="Patient Management">إدارة المرضى</h1>
        <p data-ar="هنا يمكنك عرض وتعديل بيانات المرضى المسجلين بالعيادة." data-en="Here you can view and edit registered patients' data.">هنا يمكنك عرض وتعديل بيانات المرضى المسجلين بالعيادة.</p>

        <!-- قسم الجدول -->
        <div class="table-container">
            <div class="table-header">
                <h3 data-ar="قائمة المرضى" data-en="Patients List">قائمة المرضى</h3>
                <button class="btn-primary" data-ar="+ إضافة مريض جديد" data-en="+ Add New Patient">+ إضافة مريض جديد</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th data-ar="رقم الملف" data-en="ID">رقم الملف</th>
                        <th data-ar="اسم المريض" data-en="Patient Name">اسم المريض</th>
                        <th data-ar="رقم الهاتف" data-en="Phone Number">رقم الهاتف</th>
                        <th data-ar="آخر زيارة" data-en="Last Visit">آخر زيارة</th>
                        <th data-ar="الإجراءات" data-en="Actions">الإجراءات</th>
                    </tr>
                </thead>
                <!-- ضفنا id هنا والجدول فاضي جاهز للداتا -->
                <tbody id="patients-table-body">
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>

    <!-- كود فايربيس للتحقق من تسجيل الدخول -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDD3ouvrsyqwxorPWlQdKPgZACjUO5TiWs",
            authDomain: "ali-elsewedy-media.firebaseapp.com",
            projectId: "ali-elsewedy-media",
            storageBucket: "ali-elsewedy-media.firebasestorage.app",
            messagingSenderId: "721258793080",
            appId: "1:721258793080:web:968f77abee49198fa3c58d",
            measurementId: "G-1CNDBSB0P4"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // التحقق من حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // توجيه إلى صفحة تسجيل الدخول إذا لم يكن هناك مستخدم
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
